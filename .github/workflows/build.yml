name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir app
          unzip -q *.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Inspect whisper.rn
        working-directory: app/node_modules/whisper.rn
        run: |
          node -e "const p=require('./package.json');console.log('VERSION',p.version,'MAIN',p.main);console.log(JSON.stringify(p.exports,null,1))" || true
          echo "--- FILES"
          ls
          echo "--- REALTIME"
          find . -iname "*realtime*" -not -path "./node_modules/*" | head -30
          echo "--- ADAPTERS"
          find . -iname "*adapter*" -not -path "./node_modules/*" | head -30
      - name: Check JS bundle (fast)
        working-directory: app
        run: npx expo export --platform android
      - name: Prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/android/app/build/outputs/apk/release/*.apk
