name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir app
          unzip -q *.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Fix whisper.rn imports
        working-directory: app
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const cwd = process.cwd();
          const root = path.join(cwd, "node_modules", "whisper.rn");
          const target = path.join(cwd, "lib", "offline-speech-native.native.ts");
          const SKIP = new Set(["node_modules", "android", "ios", "cpp", "example", "docs", ".git"]);

          function walk(dir, out) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { if (!SKIP.has(e.name)) walk(p, out); }
              else if (/\.(ts|tsx|js|jsx|mjs|cjs)$/.test(e.name) && !/\.d\.ts$/.test(e.name) && !/\.(test|spec)\./.test(e.name)) out.push(p);
            }
            return out;
          }

          const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
          console.log("whisper.rn version:", pkg.version);
          const files = walk(root, []);
          console.log("--- files mentioning realtime/adapter:");
          files.filter((f) => /realtime|adapter/i.test(f)).forEach((f) => console.log("  " + path.relative(root, f)));

          function rank(p, stems) {
            const r = path.relative(root, p);
            let s = r.startsWith("src" + path.sep) ? 0 : r.includes("commonjs") ? 20 : r.includes(path.join("lib", "module")) ? 10 : 15;
            const stem = path.basename(p).replace(/\.[a-z]+$/, "");
            if (!stems.includes(stem)) s += 5;
            return s;
          }

          function find(name, stems) {
            const hits = files.filter((f) => {
              const c = fs.readFileSync(f, "utf8");
              return c.includes(name) && /\bexports?\b/.test(c);
            });
            hits.sort((a, b) => rank(a, stems) - rank(b, stems));
            return hits[0] || null;
          }

          function rel(file) {
            let r = path.relative(path.dirname(target), file).split(path.sep).join("/").replace(/\.(ts|tsx|js|jsx)$/, "");
            return r.startsWith(".") ? r : "./" + r;
          }

          const rt = find("RealtimeTranscriber", ["index", "realtime-transcription"]);
          const ad = find("AudioPcmStreamAdapter", ["index", "adapters"]);
          console.log("RealtimeTranscriber module:", rt && path.relative(root, rt));
          console.log("AudioPcmStreamAdapter module:", ad && path.relative(root, ad));

          let src = fs.readFileSync(target, "utf8");
          const reRt = /const\s*\{\s*RealtimeTranscriber\s*\}\s*=\s*await import\("whisper\.rn\/realtime-transcription"\);/;
          const reAd = /const\s*\{\s*AudioPcmStreamAdapter\s*\}\s*=\s*await import\("whisper\.rn\/realtime-transcription\/adapters"\);/;
          if (!reRt.test(src) || !reAd.test(src)) { console.log("Imports already patched or changed, nothing to do."); process.exit(0); }

          if (rt && ad) {
            src = src.replace(reRt, () => `const __rt = await import("${rel(rt)}"); const RealtimeTranscriber = __rt.RealtimeTranscriber ?? __rt.default;`);
            src = src.replace(reAd, () => `const __ad = await import("${rel(ad)}"); const AudioPcmStreamAdapter = __ad.AudioPcmStreamAdapter ?? __ad.default;`);
            console.log("PATCHED: imports now point to files inside whisper.rn");
          } else {
            src = src.replace(reRt, () => `const RealtimeTranscriber: any = null; throw new Error("Realtime-распознавание недоступно в этой версии whisper.rn");`);
            src = src.replace(reAd, () => `const AudioPcmStreamAdapter: any = null;`);
            console.log("FALLBACK: realtime module not found in whisper.rn, wake-word feature disabled, APK still builds");
          }
          fs.writeFileSync(target, src);
          console.log("--- result:");
          console.log(src.split("\n").filter((l) => /__rt|__ad|RealtimeTranscriber: any|AudioPcmStreamAdapter: any/.test(l)).join("\n"));
          EOF
      - name: Check JS bundle and auto-install missing modules
        working-directory: app
        run: |
          set -u
          added=" "
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== bundle attempt $i"
            if npx expo export --platform android > export.log 2>&1; then
              tail -8 export.log
              echo "BUNDLE OK"
              exit 0
            fi
            mod=$(sed -nE '/Unable to resolve module/{s/.*Unable to resolve module ([^ ]+) from .*/\1/p;q}' export.log)
            mod=${mod%:}
            if [ -z "$mod" ]; then
              echo "Unknown bundling error:"; tail -70 export.log; exit 1
            fi
            case "$mod" in
              .*|/*|@/*) echo "Cannot auto-fix local path: $mod"; tail -70 export.log; exit 1;;
            esac
            case "$mod" in
              @*) pkg=$(echo "$mod" | cut -d/ -f1-2);;
              *)  pkg=$(echo "$mod" | cut -d/ -f1);;
            esac
            case "$pkg" in
              stream) pkg=readable-stream;;
              path) pkg=path-browserify;;
              zlib) pkg=browserify-zlib;;
              crypto) pkg=react-native-quick-crypto;;
            esac
            case "$added" in
              *" $pkg "*) echo "Already added $pkg but still failing:"; tail -70 export.log; exit 1;;
            esac
            echo ">>> Missing module '$mod', installing '$pkg'"
            added="$added$pkg "
            if ! pnpm add "$pkg" --ignore-scripts; then
              echo "pnpm add failed for $pkg"; tail -70 export.log; exit 1
            fi
          done
          echo "Too many attempts"; tail -70 export.log; exit 1
      - name: Prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/android/app/build/outputs/apk/release/*.apk
